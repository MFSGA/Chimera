on:
  pull_request:
    branches:
      - main
      - master
      - dev
      - release-*
  push:
    branches:
      - main
      - master
      - dev
      - release-*

# the name of our workflow
name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

jobs:
  lint:
    name: Lint
    strategy:
      matrix:
        targets:
          - os: ubuntu-latest
          - os: macos-latest
          - os: windows-latest
    runs-on: ${{ matrix.targets.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Normalize service runtime line endings
        if: startsWith(matrix.targets.os, 'windows-')
        shell: bash
        run: |
          if [ -d backend/chimera-runtime ]; then
            git -C backend/chimera-runtime config core.autocrlf false
            git -C backend/chimera-runtime config core.eol lf
            git -C backend/chimera-runtime checkout-index -a -f
          fi

      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup component add clippy rustfmt
          rustc --version
          cargo --version
          rustup show

      - name: Tauri dependencies
        if: startsWith(matrix.targets.os, 'ubuntu-')
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y
          libgtk-3-dev
          libayatana-appindicator3-dev
          libwebkit2gtk-4.1-dev
          librsvg2-dev
          libxdo-dev
          webkit2gtk-driver
          xvfb

      - uses: maxim-lobanov/setup-xcode@v1
        if: startsWith(matrix.targets.os, 'macos-')
        with:
          xcode-version: 'latest-stable'

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: Swatinem/rust-cache@v2
        name: Cache Rust dependencies
        with:
          workspaces: |
            backend -> target
          cache-on-failure: true

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@v6
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify service runtime pin
        run: pnpm check:service-runtime

      - name: Prepare frontend
        run: pnpm -r build # Build frontend
        env:
          NODE_OPTIONS: '--max_old_space_size=4096'
      # TODO: preapre the js script file
      - name: Prepare sidecar and resources
        run: pnpm check
      - name: Verify quality
        if: startsWith(matrix.targets.os, 'ubuntu-')
        run: pnpm verify:quality

      - name: Validate E2E harness
        if: startsWith(matrix.targets.os, 'ubuntu-')
        run: pnpm --filter @chimera/tauri-e2e test:unit

      - name: Test core endpoint parity
        if: startsWith(matrix.targets.os, 'ubuntu-')
        run: |
          cargo test --manifest-path backend/tauri/Cargo.toml core::actor_v2::endpoint::tests
          cargo test --manifest-path backend/tauri/Cargo.toml core::actor_v2::facade::tests
          cargo test --manifest-path backend/tauri/Cargo.toml core::clash::api::tests
          cargo test --manifest-path backend/tauri/Cargo.toml core::clash::transaction::tests
          cargo test --manifest-path backend/tauri/Cargo.toml client::ports::tests
          cargo test --manifest-path backend/tauri/Cargo.toml client::runtime::tests::successful_apply_clears_the_last_transform_failure
          cargo test --manifest-path backend/tauri/Cargo.toml client::runtime::tests::runtime_document_materialization_assigns_revision_without_changing_product
          cargo test --manifest-path backend/tauri/Cargo.toml core::clash::core::tests::transform_failure_attempt_does_not_consume_applied_runtime_revision
          cargo test --manifest-path backend/tauri/Cargo.toml core::clash::core::tests::local_instance_rejects_service_host
          cargo test --manifest-path backend/tauri/Cargo.toml specta_export::tests::typescript_bindings_are_fresh
          cargo test --manifest-path backend/chimera-runtime/Cargo.toml -p chimera-ipc rolled_back_output_roundtrips_failure_reason
          cargo test --manifest-path backend/chimera-runtime/Cargo.toml -p chimera-ipc core_health_wire_roundtrips_and_is_omitted_when_absent
          cargo test --manifest-path backend/chimera-runtime/Cargo.toml -p chimera-ipc core_error_kind_wire_strings_and_defaults_match_ref
          cargo test --manifest-path backend/chimera-runtime/Cargo.toml -p chimera-ipc typed_terminal_error_roundtrips_kind_and_retryable
          cargo test --manifest-path backend/chimera-runtime/Cargo.toml -p clash-api http_transport_updates_and_verifies_configs
          cargo test --manifest-path backend/chimera-runtime/Cargo.toml -p clash-api projection_verifies_only_fields_carried_by_patch
          cargo test --manifest-path backend/chimera-runtime/Cargo.toml -p clash-api extended_patch_surface_verifies_tuic_and_access_ranges
          cargo test --manifest-path backend/chimera-runtime/Cargo.toml -p chimera-service reconcile_classification_preserves_noop_patch_reload_restart_and_switch_boundaries
          cargo test --manifest-path backend/chimera-runtime/Cargo.toml -p chimera-service extended_patch_surface_matches_ref_safe_fields
          cargo test --manifest-path backend/chimera-runtime/Cargo.toml -p chimera-service reconcile_revision_preserves_epoch_for_patch_reload_restart_and_allocates_for_switch
          cargo test --manifest-path backend/chimera-runtime/Cargo.toml -p chimera-service v2_patch_verifies_read_back_after_uncertain_patch_error
          cargo test --manifest-path backend/chimera-runtime/Cargo.toml -p chimera-service v2_reload_uses_shared_controller_client_and_verifies_controller
          cargo test --manifest-path backend/chimera-runtime/Cargo.toml -p chimera-service v2_in_place_reconcile_requires_running_process_health
          cargo test --manifest-path backend/chimera-runtime/Cargo.toml -p chimera-service v2_reconcile_controller_probe_uses_version_endpoint
          cargo test --manifest-path backend/chimera-runtime/Cargo.toml -p chimera-service replace_warns_after_atomic_install_when_parent_sync_is_uncertain
          cargo test --manifest-path backend/chimera-runtime/Cargo.toml -p chimera-service backup_restore_preserves_stable_epoch_path
          cargo test --manifest-path backend/chimera-runtime/Cargo.toml -p chimera-service seed_current_migrates_legacy_digest_path_to_stable_epoch_path
          cargo test --manifest-path backend/chimera-runtime/Cargo.toml -p chimera-service durability_warning_preserves_primary_terminal_error_message
          cargo test --manifest-path backend/chimera-runtime/Cargo.toml -p chimera-service controller_binding_maps_all_transports_to_shared_client
          cargo test --manifest-path backend/chimera-runtime/Cargo.toml -p chimera-service v2_concurrent_same_id_admission_registers_exactly_once
          cargo test --manifest-path backend/chimera-runtime/Cargo.toml -p chimera-service v2_quarantine_recovery_requires_authoritative_epoch_pid_record
          cargo test --manifest-path backend/chimera-runtime/Cargo.toml -p chimera-service v2_quarantine_recovery_reaps_identity_verified_epoch_process
          cargo test --manifest-path backend/chimera-runtime/Cargo.toml -p chimera-service v2_epoch_allocator_advances_past_existing_runtime_artifacts
          cargo test --manifest-path backend/chimera-runtime/Cargo.toml -p chimera-service v2_startup_orphan_sweep_reaps_owned_process_and_seeds_allocator
          cargo test --manifest-path backend/chimera-runtime/Cargo.toml -p chimera-service v2_startup_orphan_sweep_rejects_unverifiable_pid_record
          cargo test --manifest-path backend/chimera-runtime/Cargo.toml -p chimera-service v2_startup_readiness_retries_controller_until_healthy
          cargo test --manifest-path backend/chimera-runtime/Cargo.toml -p chimera-service v2_startup_readiness_fails_closed_when_process_is_not_running
          cargo test --manifest-path backend/chimera-runtime/Cargo.toml -p chimera-service v2_liveness_health_driver_tracks_unhealthy_and_recovery
          cargo test --manifest-path backend/chimera-runtime/Cargo.toml -p chimera-service v2_health_error_detail_is_capped_without_breaking_utf8
          cargo test --manifest-path backend/chimera-runtime/Cargo.toml -p chimera-service v2_reconcile_digest_mismatch_fails_before_mutation
          cargo test --manifest-path backend/chimera-runtime/Cargo.toml -p chimera-service v2_reconcile_stale_cas_fails_before_mutation
          cargo test --manifest-path backend/chimera-runtime/Cargo.toml -p chimera-service v2_quarantined_reconcile_reports_typed_terminal_error
          cargo test --manifest-path backend/chimera-runtime/Cargo.toml -p chimera-service v2_operation_conflict_envelope_carries_kind_and_retryable
          cargo test --manifest-path backend/chimera-runtime/Cargo.toml -p chimera-service v2_operation_id_validation_and_conflict_fail_closed
          cargo test --manifest-path backend/tauri/Cargo.toml core::service::core_host::tests::submit_error_preserves_typed_server_classification

      - name: Verify generated files are committed
        if: startsWith(matrix.targets.os, 'ubuntu-')
        run: git diff --exit-code

      - name: Lint Rust
        if: startsWith(matrix.targets.os, 'ubuntu-') == false
        run: pnpm run-p lint:clippy lint:rustfmt
        env:
          NODE_OPTIONS: '--max_old_space_size=4096'
  # TODO: support test cross-platform
  build:
    name: Build Tauri
    strategy:
      matrix:
        targets:
          - os: ubuntu-latest
          - os: macos-latest
          - os: windows-latest
      fail-fast: false
    #if: >
    #  github.event_name != 'pull_request' ||
    #  contains(github.event.pull_request.title, 'crate') ||
    #  github.event.pull_request.user.login != 'renovate[bot]'
    runs-on: ${{ matrix.targets.os }}
    needs: lint
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Tauri dependencies
        if: startsWith(matrix.targets.os, 'ubuntu-')
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y
          libgtk-3-dev
          libayatana-appindicator3-dev
          libwebkit2gtk-4.1-dev
          librsvg2-dev
          libxdo-dev
          webkit2gtk-driver
          xvfb
      - uses: maxim-lobanov/setup-xcode@v1
        if: startsWith(matrix.targets.os, 'macos-')
        with:
          xcode-version: 'latest-stable'

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: Swatinem/rust-cache@v2
        name: Cache Rust dependencies
        with:
          workspaces: |
            backend -> target
          cache-on-failure: true

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@v6
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify service runtime pin
        run: pnpm check:service-runtime

      # todo: prepare the js script file
      - name: Prepare sidecar and resources
        run: pnpm check

      - name: Prepare frontend
        run: pnpm -r build
        env:
          NODE_OPTIONS: '--max_old_space_size=4096'

      - name: Build Backend
        run: cargo build --release --manifest-path backend/Cargo.toml
