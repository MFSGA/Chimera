name: '[Single] Create Updater'

on:
  workflow_dispatch:
    inputs:
      nightly:
        description: 'Nightly'
        required: true
        type: boolean
        default: false
      fixed_webview:
        description: 'Update fixed WebView nightly updater'
        required: false
        type: boolean
        default: false
      tag:
        description: 'Release Tag for the stable updater'
        required: false
        type: string
      release_body:
        description: 'Release Body'
        required: false
        type: string
  workflow_call:
    inputs:
      nightly:
        description: 'Nightly'
        required: true
        type: boolean
      fixed_webview:
        description: 'Update fixed WebView nightly updater'
        required: false
        type: boolean
        default: false
      tag:
        description: 'Release Tag for the stable updater'
        required: false
        type: string
      release_body:
        description: 'Release Body'
        required: false
        type: string
    #secrets:
    #SURGE_TOKEN:
    #  required: true

jobs:
  updater:
    name: Update Updater
    runs-on: ubuntu-latest
    concurrency:
      group: updater-manifests-${{ inputs.nightly }}-${{ inputs.fixed_webview }}
      cancel-in-progress: false
    permissions:
      id-token: write # This is required to allow the GitHub Action to authenticate with Deno Deploy.
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          # blocked by https://github.com/actions/checkout/issues/1467
      - name: Fetch git tags
        run: git fetch --tags
      - name: Install Node latest
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          run_install: false

      - name: Pnpm install
        run: pnpm install --frozen-lockfile

      - name: Test updater asset mapping
        run: pnpm test:updater-manifest

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Update Nightly Updater
        if: ${{ inputs.nightly == true }}
        run: pnpm updater:nightly
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Update Nightly Fixed Webview Updater
        if: ${{ inputs.nightly == true && inputs.fixed_webview == true }}
        run: pnpm updater:nightly --fixed-webview
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Stable Updater
        if: ${{ inputs.nightly == false }}
        run: |
          if [[ -n "$UPDATER_TAG" ]]; then
            pnpm updater --tag "$UPDATER_TAG"
          else
            pnpm updater
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATER_TAG: ${{ inputs.tag }}
          RELEASE_BODY: ${{ inputs.release_body || github.event.release.body }}
