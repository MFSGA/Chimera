name: '[Entire] Build Release Version'

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag'
        required: true
        type: string
      release_body:
        description: 'Release Body'
        required: false
        type: string

permissions:
  contents: write
  id-token: write

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short

jobs:
  service_release_gate:
    name: Verify release dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Verify application release tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          node -e "const fs=require('fs'); const version=JSON.parse(fs.readFileSync('package.json','utf8')).version; const expected='v'+version; if(process.env.RELEASE_TAG!==expected){console.error('release tag mismatch: expected '+expected+', got '+process.env.RELEASE_TAG); process.exit(1)}"

      - name: Verify stable Chimera Service dependency
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/check-service-release.ts

  macos_aarch64_build:
    needs: service_release_gate
    name: macOS aarch64 Build
    uses: ./.github/workflows/deps-build-macos.yaml
    with:
      nightly: false
      aarch64: true
      tag: ${{ inputs.tag || github.event.release.tag_name }}
    secrets: inherit
  windows_build:
    needs: service_release_gate
    name: Windows Build
    uses: ./.github/workflows/deps-build-windows-nsis.yaml
    with:
      portable: false
      nightly: false
      # todo:
      fixed-webview: false
      arch: 'x86_64'
      tag: ${{ inputs.tag || github.event.release.tag_name }}
    secrets: inherit
  linux_build:
    needs: service_release_gate
    name: Linux Build
    uses: ./.github/workflows/deps-build-linux.yaml
    with:
      nightly: false
      tag: ${{ inputs.tag || github.event.release.tag_name }}
      arch: 'x86_64'
    secrets: inherit

  upload_release_assets:
    name: Upload Release Assets
    # todo windows_build
    needs: [windows_build, linux_build, macos_aarch64_build]
    uses: ./.github/workflows/deps-upload-release-assets.yaml
    with:
      tag: ${{ inputs.tag || github.event.release.tag_name }}
    secrets: inherit

  publish_release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [upload_release_assets]
    permissions:
      contents: write
    steps:
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          gh release edit "$RELEASE_TAG" --draft=false --repo "${{ github.repository }}"

  updater:
    name: Create Updater
    uses: ./.github/workflows/deps-create-updater.yaml
    # todo windows_build
    needs: [publish_release]
    with:
      nightly: false
      release_body: ${{ inputs.release_body || github.event.release.body }}
    secrets: inherit
