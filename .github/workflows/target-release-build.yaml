name: '[Entire] Build Release Version'

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag'
        required: true
        type: string
      release_body:
        description: 'Release Body'
        required: false
        type: string

permissions:
  contents: write
  id-token: write

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short

jobs:
  service_release_gate:
    name: Verify release dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Verify application release tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          node -e "const fs=require('fs'); const version=JSON.parse(fs.readFileSync('package.json','utf8')).version; const expected='v'+version; if(process.env.RELEASE_TAG!==expected){console.error('release tag mismatch: expected '+expected+', got '+process.env.RELEASE_TAG); process.exit(1)}"

      - name: Verify stable Chimera Service dependency
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/check-service-release.ts

  system_e2e_gate:
    name: Verify Windows Service/TUN lifecycle
    needs: service_release_gate
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      CHIMERA_E2E_ARTIFACT_DIR: ${{ github.workspace }}/artifacts/release-system-e2e
      CHIMERA_E2E_SYSTEM_LIFECYCLE: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Assert elevated disposable runner
        shell: pwsh
        run: |
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = New-Object Security.Principal.WindowsPrincipal($identity)
          if (-not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
            throw 'release system lifecycle requires an elevated Windows runner'
          }

      - name: Install Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup toolchain install nightly --profile minimal --no-self-update
          rustup default stable
          rustc --version
          cargo --version

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          run_install: false

      - uses: Swatinem/rust-cache@v2
        name: Cache Rust dependencies
        with:
          workspaces: |
            backend -> target
          cache-on-failure: true

      - name: Get pnpm store directory
        shell: pwsh
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $env:GITHUB_ENV

      - uses: actions/cache@v6
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify service runtime pin
        run: pnpm check:service-runtime

      - name: Validate E2E harness
        run: pnpm --filter @chimera/tauri-e2e test:unit

      - name: Typecheck E2E harness
        run: pnpm --filter @chimera/tauri-e2e typecheck

      - name: Download checksum-verified stable sidecars and resources
        run: pnpm check

      - name: Build frontend
        run: pnpm web:build
        env:
          NODE_OPTIONS: '--max_old_space_size=4096'

      - name: Build Tauri E2E binary with stable Service sidecar
        run: cargo build --manifest-path ./backend/tauri/Cargo.toml --features e2e
        env:
          AWS_LC_SYS_PREBUILT_NASM: '1'
          CARGO_TARGET_DIR: backend/target/e2e
          TAURI_CONFIG: '{"build":{"devUrl":null}}'

      - name: Run destructive Service/TUN lifecycle
        shell: pwsh
        run: pnpm --filter @chimera/tauri-e2e exec wdio run ./wdio.conf.ts --suite system

      - name: Upload system E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-system-e2e-diagnostics-${{ github.run_id }}
          path: ${{ github.workspace }}/artifacts/release-system-e2e
          if-no-files-found: ignore

  macos_aarch64_build:
    needs: [service_release_gate, system_e2e_gate]
    name: macOS aarch64 Build
    uses: ./.github/workflows/deps-build-macos.yaml
    with:
      nightly: false
      aarch64: true
      tag: ${{ inputs.tag || github.event.release.tag_name }}
    secrets: inherit
  windows_build:
    needs: [service_release_gate, system_e2e_gate]
    name: Windows Build
    uses: ./.github/workflows/deps-build-windows-nsis.yaml
    with:
      portable: false
      nightly: false
      # todo:
      fixed-webview: false
      arch: 'x86_64'
      tag: ${{ inputs.tag || github.event.release.tag_name }}
    secrets: inherit
  linux_build:
    needs: [service_release_gate, system_e2e_gate]
    name: Linux Build
    uses: ./.github/workflows/deps-build-linux.yaml
    with:
      nightly: false
      tag: ${{ inputs.tag || github.event.release.tag_name }}
      arch: 'x86_64'
    secrets: inherit

  upload_release_assets:
    name: Upload Release Assets
    # todo windows_build
    needs: [windows_build, linux_build, macos_aarch64_build]
    uses: ./.github/workflows/deps-upload-release-assets.yaml
    with:
      tag: ${{ inputs.tag || github.event.release.tag_name }}
    secrets: inherit

  publish_release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [upload_release_assets]
    permissions:
      contents: write
    steps:
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          gh release edit "$RELEASE_TAG" --draft=false --repo "${{ github.repository }}"

  updater:
    name: Create Updater
    uses: ./.github/workflows/deps-create-updater.yaml
    # todo windows_build
    needs: [publish_release]
    with:
      nightly: false
      release_body: ${{ inputs.release_body || github.event.release.body }}
    secrets: inherit
