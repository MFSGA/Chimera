name: '[Single] Upload Release Assets'

on:
  workflow_call:
    inputs:
      tag:
        description: 'Release Tag'
        required: true
        type: string

jobs:
  upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: Clash.Nyanpasu-*
          path: ./release-assets
          merge-multiple: false

      - name: Validate unique release asset names
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path("release-assets")
          assets = sorted(path for path in root.rglob("*") if path.is_file())
          if not assets:
              raise SystemExit("No build assets were downloaded")

          names = {}
          for asset in assets:
              previous = names.get(asset.name)
              if previous is not None:
                  raise SystemExit(f"Duplicate release asset {asset.name}: {previous} and {asset}")
              names[asset.name] = asset
          print(f"Validated {len(assets)} uniquely named release assets")
          PY

      - name: Upload to release
        run: |
          find ./release-assets -type f -print0 | while IFS= read -r -d '' file; do
            echo "Uploading $file"
            gh release upload "${{ inputs.tag }}" "$file" --clobber
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
