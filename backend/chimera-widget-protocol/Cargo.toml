[package]
name = 'chimera-widget-protocol'
version = '0.1.0'
repository.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
# The widget's end of the channel to the application. Crates that only need
# the message and variant types, such as chimera-config, leave it off.
ipc = ['dep:chimera-local-channel', 'dep:snafu']
# The application's end as well. It needs chimera-local-channel's Tokio
# server, which the widget, a blocking client, does not link.
ipc-host = ['ipc', 'chimera-local-channel/tokio']

[dependencies]
clap = { version = '4', features = ['derive'] }
serde = { version = '1', features = ['derive'] }
specta = { version = '^2.0.0-rc.25', features = ['derive'] }
chimera-log-preview = { workspace = true }
chimera-local-channel = { path = '../chimera-local-channel', optional = true }
snafu = { workspace = true, optional = true }

[dev-dependencies]
serde_json = '1'
# The encoding chimera-local-channel puts on the wire, to pin the message
# layout.
postcard = { version = '1.1', default-features = false, features = ['use-std'] }
tokio = { workspace = true }
