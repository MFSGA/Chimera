[workspace]
members = ["chimera-config","chimera-core","chimera-macro","tauri"]
# `chimera-runtime` is a submodule with its own workspace root. Keep it out of
# the app workspace so its `workspace = true` dependencies resolve against the
# runtime repository, while selected crates are consumed through path deps.
exclude = ["chimera-runtime"]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"
authors = ["zzzgydi", "keiko233", "chimera_rust@proton.me"]
license = "GPL-3.0"

[profile.release]
panic = "unwind"
codegen-units = 1
lto = true
opt-level = "s"

[workspace.dependencies]
# --- chimera runtime ---
# The gitlink under `backend/chimera-runtime` is the pin. The IPC client is read
# from that exact runtime revision, while scripts derive the service sidecar
# release from `chimera_service/Cargo.toml` in the same submodule.
chimera-ipc = { path = "chimera-runtime/chimera_ipc", features = [
  "client",
  "specta",
] }

thiserror = "2"

reqwest = { version = "0.13", default-features = false, features = [
  "charset",
  "http2",
  "system-proxy",
  "json",
  "query",
  "stream",
  "rustls",
] }

tokio = { version = "1", features = ["full"] }

tracing = "0.1"
fs-err = { version = "3.1.2", features = ["tokio"] }
serde_yaml_ng = { version = "0.10", git = "https://github.com/libnyanpasu/serde-yaml-ng.git", rev = "363da138dc97f90ef0a356f971c2dc1d8fe04c9e", features = ["specta"] }
nyanpasu-utils = { git = "https://github.com/libnyanpasu/nyanpasu-utils.git", features = ["specta"] }
