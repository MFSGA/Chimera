[package]
name = 'chimera-os'
version = '0.1.0'
repository.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
verge-dev = []

[dependencies]
anyhow = '1'
chimera-contracts = { path = '../chimera-contracts', default-features = false }
runas = { git = 'https://github.com/libnyanpasu/rust-runas.git' }
snafu = { workspace = true }
async-trait = '0.1'
auto-launch = { git = 'https://github.com/libnyanpasu/auto-launch.git', version = '0.5' }
camino = '1.1.9'
dunce = '1.0.4'
reqwest = { workspace = true }
sysproxy = { git = 'https://github.com/libnyanpasu/sysproxy-rs.git', version = '0.3' }
tokio = { workspace = true }
tokio-util = '0.7'
tracing = { workspace = true }
url = '2'

tempfile = '3.9.0'
whoami = '2.0.0'
chimera-paths = { path = '../chimera-paths' }
chimera-config = { path = '../chimera-config', default-features = false, features = ['nesting'] }

[target.'cfg(windows)'.dependencies]
chimera-utils = { workspace = true, default-features = false, features = ['os'] }
windows-sys = { version = '0.61', features = ['Win32_UI_WindowsAndMessaging'] }

[dev-dependencies]
mockall = '0.15'
serde_json = '1'
chimera-contracts = { path = '../chimera-contracts', default-features = false, features = ['test-support'] }
