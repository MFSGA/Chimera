[package]
name = 'chimera-rpc-protocol'
version = '0.1.0'
repository.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = []
nesting = ['chimera-config/nesting']
frame-io = ['dep:tokio', 'chimera-rpc-wire/frame-io']
local-client = ['frame-io', 'chimera-rpc-wire/local-client']

[dependencies]
chimera-config = { path = '../chimera-config', default-features = false }
chimera-contracts = { path = '../chimera-contracts', default-features = false }
chimera-rpc-wire = { path = '../chimera-rpc-wire' }
chimera-runtime-values = { path = '../chimera-runtime-values', default-features = false }
chimera-profile-transform = { path = '../chimera-profile-transform', default-features = false }
chimera-core-metadata = { package = 'chimera-service-core-metadata', path = '../chimera-runtime/crates/chimera-core-metadata' }
chimera-logging = { path = '../chimera-runtime/crates/chimera-logging', default-features = false }
clash-api = { workspace = true }
chrono = { version = '0.4', features = ['serde'] }
indexmap = { version = '2', features = ['serde'] }
uuid = { version = '1', features = ['serde'] }
snafu = { workspace = true }
url = { version = '2', features = ['serde'] }
tokio = { version = '1', optional = true, features = ['io-util'] }
serde = { version = '1.0', features = ['derive', 'rc'] }
serde_json = { version = '1.0', features = ['preserve_order'] }
specta = { version = '^2.0.0-rc.25', features = ['derive'] }
specta-typescript = { version = '0.0.12', features = ['serde'] }

[dev-dependencies]
tokio = { version = '1', features = ['macros', 'rt', 'test-util'] }
chimera-config = { path = '../chimera-config', default-features = false, features = ['nesting'] }
