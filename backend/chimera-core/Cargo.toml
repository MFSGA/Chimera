[package]
name = "chimera-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
test-support = ["dep:mockall", "chimera-observers/test-support"]

[dependencies]
chimera-migration = { path = "../chimera-migration" }
chimera-state-engine = { path = "../chimera-state-engine" }
struct-patch = "0.14"
chimera-logging = { path = "../chimera-runtime/crates/chimera-logging", features = ["specta"] }
chimera-diagnose = { path = "../chimera-diagnose" }
chimera-owner-support = { path = "../chimera-owner-support" }
hex = "0.4"
chimera-observers = { path = "../chimera-observers" }
zstd = "0.14.0"
nanoid = "0.5.0"
chimera-profile-transform = { path = "../chimera-profile-transform" }
chimera-persistence = { path = "../chimera-persistence" }
anyhow = "1"
bon = "3"
arc-swap = "1"
async-trait = "0.1"
dashmap = "6"
indexmap = { version = "2.2.3", features = ["serde"] }
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
serde = { version = "1.0", features = ["derive"] }
specta = { version = "^2.0.0-rc.25", features = ["serde_json", "serde_yaml", "uuid", "url", "indexmap"] }
specta-typescript = { version = "0.0.12", features = ["serde"] }
clash-api = { workspace = true }
chimera-core-manager = { workspace = true }
chimera-utils = { workspace = true, features = ["core_manager"] }
chimera-config = { path = "../chimera-config" }
chimera-contracts = { path = "../chimera-contracts" }
chimera-ipc = { workspace = true }
chimera-traffic = { path = "../chimera-traffic", features = ["legacy-redb"] }
chimera-tsdb = { path = "../chimera-tsdb", features = ["redb"] }
chimera-geodata = { path = "../chimera-geodata" }
futures-util = "0.3"
serde_json = "1"
serde_yaml = "0.9"
semver = "1"
tokio-util = { workspace = true }
ractor = "0.16"
chrono = { version = "0.4", features = ["serde"] }
url = "2"
time = { version = "0.3", features = ["formatting"] }
uuid = { version = "1", features = ["serde", "v4"] }
atomicwrites = "0.4.4"
redb = "4.0.0"
parking_lot = "0.12"
camino = { version = "1.1.9", features = ["serde1"] }
fs-err.workspace = true
serde_yaml_ng.workspace = true
memmap2 = "0.9"
notify-debouncer-full = "0.7.0"
sha2 = "0.10"
tempfile = "3"
mockall = { version = "0.15", optional = true }

snafu = { workspace = true }
strum = { version = "0.28", features = ["derive"] }

[dev-dependencies]
tracing-subscriber = "0.3"
chimera-observers = { path = "../chimera-observers", features = ["test-support"] }
mockall = "0.15"
tokio = { workspace = true, features = ["full", "test-util"] }
axum = "0.8"
chimera-contracts = { path = "../chimera-contracts", features = ["test-support"] }
