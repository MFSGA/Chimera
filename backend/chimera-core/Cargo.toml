[package]
name = "chimera-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
anyhow = "1"
bon = "3"
arc-swap = "1"
async-trait = "0.1"
dashmap = "6"
indexmap = { version = "2.2.3", features = ["serde"] }
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
serde = { version = "1.0", features = ["derive"] }
specta = { version = "^2.0.0-rc.25", features = ["serde_json", "serde_yaml", "uuid", "url", "indexmap"] }
clash-api = { workspace = true }
chimera-core-manager = { workspace = true }
chimera-utils = { workspace = true, features = ["core_manager"] }
chimera-config = { path = "../chimera-config" }
chimera-ipc = { workspace = true }
futures-util = "0.3"
serde_json = "1"
serde_yaml = "0.9"
tokio-util = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }
url = "2"
atomicwrites = "0.4.4"
camino = { version = "1.1.9", features = ["serde1"] }
fs-err.workspace = true
serde_yaml_ng.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
tempfile = "3"
