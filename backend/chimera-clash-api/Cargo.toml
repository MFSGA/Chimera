[package]
name = "chimera-clash-api"
version = "1.0.0-rc.6"
edition.workspace = true
license.workspace = true

[dependencies]
backon = "1"
chrono = { version = "0.4", features = ["serde"] }
futures-core = "0.3"
futures-util = "0.3"
indexmap = { version = "2", features = ["serde"] }
chimera-utils = { workspace = true, features = ["reqwest"] }
ipnet = { version = "2", features = ["serde"] }
reqwest = { version = "0.13", features = ["json", "query", "stream"] }
reqwest-websocket = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "^2.0.0-rc.25", features = ["chrono", "derive", "indexmap", "serde_json", "url", "uuid"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec", "io", "rt"] }
url = "2"
uuid = { version = "1", features = ["serde"] }
