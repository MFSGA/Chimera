[package]
name = "chimera-clash-api"
version = "1.0.0-rc.6"
edition.workspace = true
license.workspace = true

[features]
allocation-probes = ["dep:dhat"]

[dependencies]
backon = "1"
chrono = { version = "0.4", features = ["serde"] }
dhat = { version = "0.3", optional = true }
futures-core = "0.3"
futures-util = "0.3"
indexmap = { version = "2", features = ["serde"] }
chimera-serde = { path = "../chimera-serde", features = ["indexmap"] }
chimera-utils = { workspace = true, features = ["reqwest"] }
ipnet = { version = "2", features = ["serde"] }
reqwest = { version = "0.13", features = ["json", "query", "stream"] }
reqwest-websocket = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "^2.0.0-rc.25", features = ["chrono", "derive", "indexmap", "serde_json", "url", "uuid"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec", "io", "rt"] }
url = "2"
uuid = { version = "1", features = ["serde"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tungstenite = { version = "0.28", default-features = false }

[dev-dependencies]
tempfile = "3"
axum = { version = "0.8", features = ["ws"] }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["service", "tokio"] }
specta-serde = "0.0.12"
specta-typescript = "0.0.12"
specta-util = "0.0.12"

[target."cfg(windows)".dev-dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[[example]]
name = "connections_allocations"
required-features = ["allocation-probes"]

[[example]]
name = "websocket_text_allocations"
required-features = ["allocation-probes"]
