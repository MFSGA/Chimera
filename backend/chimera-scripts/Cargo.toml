[package]
name = 'chimera-scripts'
version = '0.1.0'
repository.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = ['javascript', 'lua']
javascript = ['dep:rquickjs', 'dep:parking_lot', 'dep:oxc_allocator', 'dep:oxc_ast', 'dep:oxc_ast_visit', 'dep:oxc_parser', 'dep:oxc_span', 'dep:oxc_syntax']
lua = ['dep:mlua']
test-support = []

[dependencies]
chimera-config = { path = '../chimera-config', default-features = false, features = ['nesting'] }
chimera-profile-transform = { path = '../chimera-profile-transform' }
anyhow = '1'
async-trait = '0.1'
serde_json = { version = '1', features = ['preserve_order'] }
serde_yaml = '0.9'
serde_yaml_ng.workspace = true
tokio.workspace = true
rquickjs = { version = '0.13.0', optional = true }
parking_lot = { version = '0.12', optional = true }
mlua = { version = '0.12', features = ['lua54', 'vendored', 'serde'], optional = true }
oxc_parser = { version = '0.152', optional = true }
oxc_allocator = { version = '0.152', optional = true }
oxc_span = { version = '0.152', optional = true }
oxc_ast = { version = '0.152', optional = true }
oxc_syntax = { version = '0.152', optional = true }
oxc_ast_visit = { version = '0.152', optional = true }
