[package]
name = 'chimera-profile-io'
version = '0.1.0'
repository.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
chimera-config = { path = '../chimera-config', default-features = false, features = [
  'nesting'
] }
chimera-contracts = { path = '../chimera-contracts', default-features = false }
chimera-persistence = { path = '../chimera-persistence', default-features = false }
chimera-paths = { path = '../chimera-paths' }
atomicwrites = '0.4.4'
hex = '0.4'
nanoid = '0.5.0'
serde = { version = '1.0', features = ['derive'] }
serde_yaml = '0.9'
sha2 = '0.10'
snafu = { workspace = true }

[dev-dependencies]
serde_json = { version = '1', features = ['preserve_order'] }
tempfile = '3'
