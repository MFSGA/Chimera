[package]
name = 'chimera-contracts'
version = '0.1.0'
repository.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
test-support = ['dep:mockall']

[dependencies]
chimera-config = { path = '../chimera-config', default-features = false, features = [
  'nesting'
] }
chimera-paths = { path = '../chimera-paths' }
chimera-profile-transform = { path = '../chimera-profile-transform', default-features = false }
chimera-core-metadata = { package = 'chimera-service-core-metadata', path = '../chimera-runtime/crates/chimera-core-metadata' }

anyhow = '1'
atomicwrites = '0.4.4'
bytes = '1'
serde_json = '1'
async-trait = '0.1'
mockall = { version = '0.15', optional = true }
serde = { version = '1.0', features = ['derive'] }
semver = '1.0'
sha1 = '0.11'
sha2 = '0.11'
strum = '0.28'
x509-parser = '0.18'
zeroize = { version = '1.9', features = ['derive'] }
snafu = { workspace = true }
serde_yaml = '0.9'
specta = { version = '^2.0.0-rc.25' }
url = '2'
tempfile = '3'
tokio-util = '0.7'

[target.'cfg(not(windows))'.dependencies]
whoami = '2.0.0'

[dev-dependencies]
mockall = '0.15'
tokio = { workspace = true, features = ['macros', 'rt'] }
