packages:
  - 'frontend/*'
  - 'scripts'
  - 'tauri-e2e'
overrides:
  # @wdio/tauri-service@1.4.0 pins globals@9.29.1, whose expect peer is
  # incompatible with the WDIO 9.31 / expect-webdriverio 6 set used here.
  # Remove this once tauri-service updates its pinned WDIO dependencies.
  '@wdio/globals@9.29.1': 10.0.0
  '@wdio/native-utils': 2.7.0
#patchedDependencies:
#  monaco-worker-manager@2.0.1: patches/monaco-worker-manager@2.0.1.patch
allowBuilds:
  '@parcel/watcher': true
  '@tailwindcss/oxide': true
  core-js-pure: true
  edgedriver: false
  electron: true
  esbuild: true
  geckodriver: false
  meta-json-schema: true
  oxc-resolver: true
minimumReleaseAgeExclude:
  - '@iconify/json@2.2.491'
  - '@inlang/paraglide-js@2.22.0'
  - '@inlang/paraglide-js@2.25.2'
  - '@tanstack/react-router@1.170.18'
  - '@tanstack/router-core@1.171.15'
  - '@tanstack/router-generator@1.167.19'
  - '@tanstack/router-plugin@1.168.20'
  - meta-json-schema@1.19.28
  - postcss@8.5.19
  - prettier@3.9.6
